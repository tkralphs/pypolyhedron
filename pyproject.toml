[build-system]
requires = [
     "setuptools >= 64",
     "numpy >= 2.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "pypolyhedron"
version = "0.4.0"
description = "Front end to CDD"
requires-python = ">=3.10"
dependencies = [
    "numpy >= 2.0"
]

[project.urls]
Homepage = "https://github.com/tkralphs"
Repository = "https://github.com/tkralphs/pypolyhedron"

[dependency-groups]
dev = [
    "pytest >= 8.0.0",
    "ruff >= 0.3.0",
]

[tool.pytest]
testpaths = ["test"]
addopts = ["--import-mode=importlib"]
